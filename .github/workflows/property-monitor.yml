name: Property Monitor

on:
  schedule:
    # Weekly on Monday at 07:00 UTC (08:00 / 09:00 French local)
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

concurrency:
  group: property-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run monitor
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/property_monitor.py

      - name: Commit changes if any
        run: |
          git config user.name "property-monitor[bot]"
          git config user.email "property-monitor@users.noreply.github.com"
          git add properties/data/listings.json
          if git diff --cached --quiet; then
            echo "No listing changes."
          else
            git commit -m "chore(monitor): update property listings"
            git push
          fi
